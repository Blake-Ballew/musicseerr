services:
  musicseerr:
    # Published by .github/workflows/docker-publish.yml on every push to main
    image: ghcr.io/blake-ballew/musicseerr:latest
    container_name: musicseerr
    restart: unless-stopped
    ports:
      # 5757 avoids colliding with Jellyseerr/Overseerr on 5055
      - '5757:5757'
    environment:
      PORT: '5757'
      TZ: America/New_York
      # Optional: artist images/bios and popular charts
      # FANART_API_KEY: your_fanart_api_key
      # LASTFM_API_KEY: your_lastfm_api_key
    volumes:
      - ./config/musicseerr:/app/config
